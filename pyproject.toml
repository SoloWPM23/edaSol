[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edaSol"
version = "1.0.0"
description = "Library to help accelerating Exploratory Data Analysis (EDA)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Solo Manurung", email = "solowandika490@gmail.com"}
]
keywords = [
    "eda",
    "exploratory-data-analysis",
    "pandas",
    "data-analysis",
    "data-science",
    "visualization",
]
dependencies = [
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "numpy>=1.20.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/SoloWPM23/edaSol"
Repository = "https://github.com/SoloWPM23/edaSol"
Issues = "https://github.com/SoloWPM23/edaSol/issues"

[tool.setuptools]
# Kunci paket secara eksplisit supaya direktori tests/ tidak ikut dibungkus
packages = ["edaSol"]

[tool.setuptools.package-data]
# Sertakan marker PEP 561 agar type hints terbaca oleh mypy di sisi pengguna
edaSol = ["py.typed"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# Rule-set minimal dan eksplisit: pyflakes (F) untuk bug nyata seperti import
# tak terpakai, plus subset pycodestyle (E4/E7/E9). Aturan penamaan (N) sengaja
# tidak dipakai agar konvensi lowerCamelCase proyek tidak dianggap pelanggaran.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Proyek memakai konvensi lowerCamelCase, jadi pola discovery default pytest
# (test_*.py / test_*) diperlebar agar file seperti testCore.py ikut terbaca.
testpaths = ["tests"]
python_files = ["test*.py"]
python_functions = ["test*"]
